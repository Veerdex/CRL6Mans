<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f2f3f9;
    --grid: rgba(90, 98, 140, 0.07);
    --card: #ffffff;
    --card-2: #f7f7fc;
    --border: #e1e3ee;
    --text: #191b28;
    --dim: #565b74;
    --faint: #8388a0;
    --accent: #6a53e0;
    --accent-ink: #ffffff;
    --accent-soft: rgba(106, 83, 224, 0.1);
    --blue: #2f66e0;
    --blue-soft: rgba(47, 102, 224, 0.09);
    --orange: #d9721b;
    --orange-soft: rgba(217, 114, 27, 0.1);
    --red: #d1425a;
    --red-soft: rgba(209, 66, 90, 0.1);
    --amber: #a66a08;
    --amber-soft: rgba(166, 106, 8, 0.1);
    --green: #1f8f68;
    --shadow: 0 1px 2px rgba(30, 32, 60, 0.04), 0 8px 24px -12px rgba(30, 32, 60, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0b12;
      --grid: rgba(150, 160, 220, 0.05);
      --card: #12141e;
      --card-2: #171a26;
      --border: #262a3a;
      --text: #e9eaf4;
      --dim: #9599b0;
      --faint: #666b85;
      --accent: #8f7dff;
      --accent-ink: #14101f;
      --accent-soft: rgba(143, 125, 255, 0.14);
      --blue: #6d9bff;
      --blue-soft: rgba(109, 155, 255, 0.12);
      --orange: #ff9d4d;
      --orange-soft: rgba(255, 157, 77, 0.12);
      --red: #ff7590;
      --red-soft: rgba(255, 117, 144, 0.12);
      --amber: #f0b429;
      --amber-soft: rgba(240, 180, 41, 0.12);
      --green: #3ddb9b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0a0b12;
    --grid: rgba(150, 160, 220, 0.05);
    --card: #12141e;
    --card-2: #171a26;
    --border: #262a3a;
    --text: #e9eaf4;
    --dim: #9599b0;
    --faint: #666b85;
    --accent: #8f7dff;
    --accent-ink: #14101f;
    --accent-soft: rgba(143, 125, 255, 0.14);
    --blue: #6d9bff;
    --blue-soft: rgba(109, 155, 255, 0.12);
    --orange: #ff9d4d;
    --orange-soft: rgba(255, 157, 77, 0.12);
    --red: #ff7590;
    --red-soft: rgba(255, 117, 144, 0.12);
    --amber: #f0b429;
    --amber-soft: rgba(240, 180, 41, 0.12);
    --green: #3ddb9b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.5);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0 / 22px 22px,
      var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 36px 16px 90px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  .masthead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 {
    font-family: "Oxanium", "IBM Plex Sans", sans-serif;
    font-weight: 700; font-size: 1.65rem; letter-spacing: 0.01em; margin: 0;
    text-wrap: balance;
  }
  .kicker {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px;
  }
  .sub { color: var(--faint); font-size: 0.88rem; margin: 6px 0 26px; max-width: 62ch; line-height: 1.55; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card-header {
    padding: 13px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 38px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    user-select: none;
  }
  .drop:hover, .drop.drag { border-color: var(--accent); background: var(--accent-soft); }
  .drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .drop p { margin: 0; font-size: 0.92rem; color: var(--dim); }
  .drop .fname { color: var(--text); font-weight: 600; font-family: "JetBrains Mono", monospace; font-size: 0.85rem; }
  .drop .hint { font-size: 0.75rem; color: var(--faint); margin-top: 6px; }
  .row { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: "IBM Plex Sans", sans-serif;
    transition: opacity .15s, background .15s, border-color .15s, color .15s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .save-note { font-size: 0.76rem; color: var(--faint); }
  .error {
    background: var(--red-soft);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 14px 18px;
    color: var(--red);
    font-size: 0.85rem;
    margin-bottom: 16px;
    white-space: pre-wrap;
    font-family: "JetBrains Mono", monospace;
  }
  .warn {
    background: var(--amber-soft);
    border: 1px solid var(--amber);
    border-radius: 10px;
    padding: 12px 18px;
    color: var(--amber);
    font-size: 0.78rem;
    margin-bottom: 16px;
  }
  .summary {
    display: flex; flex-wrap: wrap; gap: 30px; align-items: center;
    padding: 20px 22px;
  }
  .score {
    display: flex; align-items: baseline; gap: 10px; font-weight: 700; font-size: 2rem;
    font-family: "Oxanium", monospace; font-variant-numeric: tabular-nums;
  }
  .score .b { color: var(--blue); } .score .o { color: var(--orange); } .score .dash { color: var(--faint); font-size: 1.1rem; }
  .meta-item { font-size: 0.82rem; }
  .meta-item .k { color: var(--faint); margin-right: 5px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    text-align: left; padding: 9px 14px; font-size: 0.66rem; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--faint); border-bottom: 1px solid var(--border);
    background: var(--card-2); font-weight: 600;
  }
  thead th.num { text-align: right; }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: "JetBrains Mono", monospace; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--card-2); }
  .team-head { padding: 11px 20px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; border-left: 3px solid transparent; }
  .team-head.blue { color: var(--blue); background: var(--blue-soft); border-left-color: var(--blue); }
  .team-head.orange { color: var(--orange); background: var(--orange-soft); border-left-color: var(--orange); }
  .pname { color: var(--text); font-weight: 600; }
  .demo-list { padding: 6px 0; }
  .demo-row { display: flex; align-items: center; gap: 12px; padding: 11px 20px; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
  .demo-row:last-child { border-bottom: none; }
  .demo-t {
    color: var(--faint); font-variant-numeric: tabular-nums; width: 54px; flex-shrink: 0;
    font-family: "JetBrains Mono", monospace; font-size: 0.78rem;
  }
  .demo-empty { padding: 28px 20px; text-align: center; color: var(--faint); font-size: 0.85rem; }
  .badge { font-size: 0.63rem; font-weight: 700; padding: 2px 8px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge.self { background: var(--red-soft); color: var(--red); }
  details { font-size: 0.8rem; }
  summary {
    cursor: pointer; padding: 13px 20px; color: var(--dim); font-weight: 600; font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 0.06em; list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary:hover { color: var(--text); }
  summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  summary::before { content: "▸ "; display: inline-block; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  pre {
    margin: 0; padding: 15px 20px; background: var(--card-2); max-height: 420px; overflow: auto;
    font-family: "JetBrains Mono", monospace; font-size: 0.72rem; line-height: 1.6; color: var(--dim);
    border-top: 1px solid var(--border);
  }
  .spin {
    width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: currentColor;
    border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: -2px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <h1>Replay Analyzer</h1>
    <span class="kicker">Runs locally</span>
  </div>
  <p class="sub">Drop in a .replay file to see the box score and every demolition — parsed straight out of the network stream, not just the end-of-game totals. Nothing is uploaded; it never leaves this page.</p>

  <div class="card">
    <div class="row">
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose a replay file">
        <p id="dropText">Tap to choose, or drag &amp; drop, a <span style="color:var(--text)">.replay</span> file</p>
        <p class="hint">Max 64&nbsp;MB &middot; parsed on-device</p>
      </div>
      <input id="fileInput" type="file" accept=".replay" style="display:none">
      <div class="actions">
        <button id="analyzeBtn" class="btn-primary" disabled>Analyze Replay</button>
      </div>
    </div>
  </div>

  <div id="errorBox"></div>
  <div id="warnBox"></div>
  <div id="results"></div>
</div>

<script>
"use strict";

/* =====================================================================
 * Rocket League .replay parser — header, body metadata, and full
 * network-stream (per-frame actor/attribute) decode, entirely client
 * side in vanilla JS.
 *
 * The network-stream algorithm (bit-packed frame/actor/attribute layout,
 * the bounded "max" integer scheme, the SPAWN_STATS / PARENT_CLASSES /
 * ATTRIBUTES class tables) is an independent re-implementation following
 * the publicly documented format used by the boxcars project
 * (github.com/nickbabcock/boxcars, MIT/Apache-2.0) — no code from that
 * project is copied here, only the reverse-engineered wire format.
 * ===================================================================== */

// ---------------------------------------------------------------------
// Byte-level reader (header + body metadata; always byte-aligned)
// ---------------------------------------------------------------------
function makeByteReader(bytes) {
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const state = { pos: 0 };
  const winDecoder = new TextDecoder("windows-1252");
  const utf16Decoder = new TextDecoder("utf-16le");
  return {
    get pos() { return state.pos; },
    set pos(v) { state.pos = v; },
    u32() { const v = dv.getUint32(state.pos, true); state.pos += 4; return v; },
    i32() { const v = dv.getInt32(state.pos, true); state.pos += 4; return v; },
    f32() { const v = dv.getFloat32(state.pos, true); state.pos += 4; return v; },
    u64() { const v = dv.getBigUint64(state.pos, true); state.pos += 8; return v; },
    bytes(n) { const s = bytes.subarray(state.pos, state.pos + n); state.pos += n; return s; },
    fstr() {
      const length = this.i32();
      if (length === 0) return "";
      const utf16 = length < 0;
      const charCount = Math.abs(length);
      const byteLen = utf16 ? charCount * 2 : charCount;
      const slice = this.bytes(byteLen);
      if (utf16) {
        const s = utf16Decoder.decode(slice);
        const t = s.indexOf("\0");
        return t === -1 ? s : s.slice(0, t);
      }
      let t = slice.indexOf(0);
      if (t === -1) t = slice.length;
      return winDecoder.decode(slice.subarray(0, t));
    },
    arr(readOne) {
      const n = this.u32();
      if (n > 5_000_000) throw new Error("Implausible array length " + n);
      const out = new Array(n);
      for (let i = 0; i < n; i++) out[i] = readOne();
      return out;
    },
  };
}

// ---------------------------------------------------------------------
// Bit-level reader, LSB-first (matches the `bitter` LittleEndianReader
// semantics the reference implementation is built on).
// ---------------------------------------------------------------------
const f32Scratch = new DataView(new ArrayBuffer(4));

class BitReader {
  constructor(buf, start, end) {
    this.buf = buf;
    this.bitPos = start * 8;
    this.endBit = end * 8;
  }
  bitsRemaining() { return this.endBit - this.bitPos; }
  isEmpty() { return this.bitsRemaining() <= 0; }

  readBitsN(n) {
    if (n === 0) return 0;
    if (this.bitPos + n > this.endBit) return null;
    let result = 0, bitIndex = 0, p = this.bitPos;
    while (bitIndex < n) {
      const byteIdx = p >>> 3;
      const bitInByte = p & 7;
      const take = Math.min(8 - bitInByte, n - bitIndex);
      const chunk = (this.buf[byteIdx] >>> bitInByte) & ((1 << take) - 1);
      result += chunk * Math.pow(2, bitIndex);
      bitIndex += take;
      p += take;
    }
    this.bitPos = p;
    return result;
  }
  readBitsBig(n) {
    if (this.bitPos + n > this.endBit) return null;
    let result = 0n, bitIndex = 0, p = this.bitPos;
    while (bitIndex < n) {
      const byteIdx = p >>> 3;
      const bitInByte = p & 7;
      const take = Math.min(8 - bitInByte, n - bitIndex);
      const chunk = (this.buf[byteIdx] >>> bitInByte) & ((1 << take) - 1);
      result += BigInt(chunk) << BigInt(bitIndex);
      bitIndex += take;
      p += take;
    }
    this.bitPos = p;
    return result;
  }
  readBit() { const v = this.readBitsN(1); return v === null ? null : v === 1; }
  readBitsMaxComputed(bitsN, max) {
    const data = this.readBitsN(bitsN);
    if (data === null) return null;
    const up = data + Math.pow(2, bitsN);
    if (up >= max) return data;
    const extra = this.readBit();
    if (extra === null) return null;
    return extra ? up : data;
  }
  ifGet(readFn) {
    const b = this.readBit();
    if (b === null) return undefined;
    if (!b) return null;
    return readFn(this);
  }
  readU8() { return this.readBitsN(8); }
  readU32() { return this.readBitsN(32); }
  readI32() { const v = this.readBitsN(32); return v === null ? null : v | 0; }
  readU64() { return this.readBitsBig(64); }
  readI64() { const v = this.readBitsBig(64); return v === null ? null : BigInt.asIntN(64, v); }
  readF32() {
    const v = this.readBitsN(32);
    if (v === null) return null;
    f32Scratch.setUint32(0, v >>> 0, true);
    return f32Scratch.getFloat32(0, true);
  }
  readBytes(n) {
    const out = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const v = this.readBitsN(8);
      if (v === null) return null;
      out[i] = v;
    }
    return out;
  }
}

function bitWidth(input) {
  if (input === 0) return 0;
  let n = 0, x = BigInt(input);
  for (let i = 63; i >= 0; i--) {
    if ((x >> BigInt(i)) & 1n) { n = i + 1; break; }
  }
  return n;
}

// ---------------------------------------------------------------------
// Vector3i / Vector3f / Quaternion / Rotation
// ---------------------------------------------------------------------
function decodeVector3i(bits, netVersion) {
  const maxSize = netVersion >= 7 ? 22 : 20;
  const sizeBits = bits.readBitsMaxComputed(4, maxSize);
  if (sizeBits === null) return null;
  const bias = Math.pow(2, sizeBits + 1);
  const bitLimit = sizeBits + 2;
  const dx = bits.readBitsN(bitLimit), dy = bits.readBitsN(bitLimit), dz = bits.readBitsN(bitLimit);
  if (dx === null || dy === null || dz === null) return null;
  return { x: dx - bias, y: dy - bias, z: dz - bias };
}
function decodeVector3f(bits, netVersion) {
  const v = decodeVector3i(bits, netVersion);
  return v ? { x: v.x / 100, y: v.y / 100, z: v.z / 100 } : null;
}
function unpackQuat(val) {
  const maxValue = (1 << 18) - 1;
  const posRange = val / maxValue;
  return ((posRange - 0.5) * 2.0) * (1 / Math.SQRT2);
}
function decodeQuaternion(bits) {
  const largest = bits.readBitsN(2);
  const a = unpackQuat(bits.readBitsN(18)), b = unpackQuat(bits.readBitsN(18)), c = unpackQuat(bits.readBitsN(18));
  const extra = Math.sqrt(Math.max(0, 1 - a * a - b * b - c * c));
  switch (largest) {
    case 0: return { x: extra, y: a, z: b, w: c };
    case 1: return { x: a, y: extra, z: b, w: c };
    case 2: return { x: a, y: b, z: extra, w: c };
    default: return { x: a, y: b, z: c, w: extra };
  }
}
function decodeQuaternionCompressed(bits) {
  const f = () => { const res = bits.readBitsN(16); return (res - 32768) * (1 / 32767); };
  return { x: f(), y: f(), z: f(), w: 0 };
}
function decodeRotation(bits) {
  const toI8 = (v) => (v << 24) >> 24;
  const hasYaw = bits.readBitsN(1);
  const yaw = hasYaw ? toI8(bits.readBitsN(8)) : null;
  const hasPitch = bits.readBitsN(1);
  const pitch = hasPitch ? toI8(bits.readBitsN(8)) : null;
  const hasRoll = bits.readBitsN(1);
  const roll = hasRoll ? toI8(bits.readBitsN(8)) : null;
  return { yaw, pitch, roll };
}

// ---------------------------------------------------------------------
// SPAWN_STATS / PARENT_CLASSES / ATTRIBUTES tables
// (independently reconstructed from the public replay-format spec)
// ---------------------------------------------------------------------
const SPAWN_NONE = 0, SPAWN_LOCATION = 1, SPAWN_LOC_ROT = 2;
const SPAWN_STATS = [
  ["Engine.Actor", SPAWN_LOCATION],
  ["Engine.ZoneInfo", SPAWN_NONE],
  ["TAGame.BreakOutActor_Platform_TA", SPAWN_NONE],
  ["TAGame.CrowdActor_TA", SPAWN_NONE],
  ["TAGame.CrowdManager_TA", SPAWN_NONE],
  ["TAGame.HauntedBallTrapTrigger_TA", SPAWN_NONE],
  ["TAGame.InMapScoreboard_TA", SPAWN_NONE],
  ["TAGame.PlayerStart_Platform_TA", SPAWN_NONE],
  ["TAGame.RBActor_TA", SPAWN_LOC_ROT],
  ["TAGame.VehiclePickup_Boost_TA", SPAWN_NONE],
  ["TAGame.KeepUpIndicator_TA", SPAWN_LOC_ROT],
];

const PARENT_CLASSES = {
  "Archetypes.Ball.Ball_Anniversary": "TAGame.Ball_TA", "Archetypes.Ball.Ball_BasketBall_Mutator": "TAGame.Ball_TA",
  "Archetypes.Ball.Ball_Basketball": "TAGame.Ball_TA", "Archetypes.Ball.Ball_BasketBall": "TAGame.Ball_TA",
  "Archetypes.Ball.Ball_Beachball": "TAGame.Ball_TA", "Archetypes.Ball.Ball_Breakout": "TAGame.Ball_Breakout_TA",
  "Archetypes.Ball.Ball_Default": "TAGame.Ball_TA", "Archetypes.Ball.Ball_Ekin": "TAGame.Ball_TA",
  "Archetypes.Ball.Ball_Fire_Obstacle": "TAGame.Ball_Fire_TA", "Archetypes.Ball.Ball_Fire": "TAGame.Ball_Fire_TA",
  "Archetypes.Ball.Ball_Football": "TAGame.Ball_TA", "Archetypes.Ball.Ball_God": "TAGame.Ball_God_TA",
  "Archetypes.Ball.Ball_Haunted": "TAGame.Ball_Haunted_TA", "Archetypes.Ball.ball_luminousairplane": "TAGame.Ball_TA",
  "Archetypes.Ball.Ball_PizzaPuck": "TAGame.Ball_TA", "Archetypes.Ball.Ball_Puck": "TAGame.Ball_TA",
  "Archetypes.Ball.Ball_RingSpawner": "TAGame.Ball_Spawner_TA", "Archetypes.Ball.Ball_Score": "TAGame.Ball_Breakout_TA",
  "Archetypes.Ball.Ball_Shoe": "TAGame.Ball_TA", "Archetypes.Ball.Ball_SpookyBalloon": "TAGame.Ball_TA",
  "Archetypes.Ball.Ball_Strike": "TAGame.Ball_TA", "Archetypes.Ball.Ball_Training": "TAGame.Ball_Tutorial_TA",
  "Archetypes.Ball.Ball_Trajectory": "TAGame.Ball_Trajectory_TA", "Archetypes.Ball.Ball_Tutorial": "TAGame.Ball_Tutorial_TA",
  "Archetypes.Ball.Ball_WorldCup": "TAGame.Ball_TA", "Archetypes.Ball.BallComponent_KeepUp": "TAGame.BallKeepUpComponent_TA",
  "Archetypes.Ball.CubeBall": "TAGame.Ball_TA", "Archetypes.Car.Car_Default": "TAGame.Car_TA",
  "Archetypes.Car.Car_PostGameLobby": "TAGame.Car_Freeplay_TA", "Archetypes.CarComponents.CarComponent_Boost": "TAGame.CarComponent_Boost_TA",

function normalizeObject(name) {
  const PREFIX = "TheWorld:PersistentLevel.";
  if (name.length <= "TheWorld:PersistentLevel.CrowdActor_TA".length) return name;
  let rest = null;
  if (name.startsWith(PREFIX)) rest = name.slice(PREFIX.length);
  else {
    const dot = name.indexOf(".");
    if (dot !== -1) {
      const suffix = name.slice(dot + 1);
      if (suffix.startsWith(PREFIX)) rest = suffix.slice(PREFIX.length);
    }
  }
  if (rest === null) return name;
  if (rest.startsWith("CrowdActor_TA")) return "TheWorld:PersistentLevel.CrowdActor_TA";
  if (rest.startsWith("CrowdManager_TA")) return "TheWorld:PersistentLevel.CrowdManager_TA";
  if (rest.startsWith("VehiclePickup_Boost_TA")) return "TheWorld:PersistentLevel.VehiclePickup_Boost_TA";
  if (rest.startsWith("InMapScoreboard_TA")) return "TheWorld:PersistentLevel.InMapScoreboard_TA";
  if (rest.startsWith("BreakOutActor_Platform_TA")) return "TheWorld:PersistentLevel.BreakOutActor_Platform_TA";
  if (rest.startsWith("PlayerStart_Platform_TA")) return "TheWorld:PersistentLevel.PlayerStart_Platform_TA";
  return name;
}

// ---------------------------------------------------------------------
// Header property-map reader (IntProperty/StrProperty/.../ArrayProperty)
// ---------------------------------------------------------------------
function readProps(r, boolWidth, depth) {
  depth = depth || 0;
  if (depth > 12) throw new Error("Property nesting too deep");
  const props = {};
  for (let guard = 0; guard < 20000; guard++) {
    const name = r.fstr();
    if (!name || name === "None") return props;
    const kind = r.fstr();
    const sizeOffset = r.pos;
    const size = Number(r.u64 ? r.u64() : 0n);
    let value;
    switch (kind) {
      case "IntProperty": value = r.i32(); break;
      case "FloatProperty": value = r.f32(); break;
      case "StrProperty": case "NameProperty": value = r.fstr(); break;
      case "BoolProperty": value = (boolWidth === 4 ? r.i32() : r.bytes(1)[0]) !== 0; break;
      case "QWordProperty": value = r.u64().toString(); break;
      case "ByteProperty": {
        const enumType = r.fstr();
        const bytesAfterSize = r.pos - (sizeOffset + 8);
        const enumValue = bytesAfterSize < size ? r.fstr() : "None";
        value = { enumType, enumValue };
        break;
      }
      case "StructProperty": {
        const typeName = r.fstr();
        if (typeName === "Vector") value = { type: typeName, x: r.f32(), y: r.f32(), z: r.f32() };
        else if (typeName === "Rotator") value = { type: typeName, pitch: r.i32(), yaw: r.i32(), roll: r.i32() };
        else { r.bytes(size); value = { type: typeName, skipped: true }; }
        break;
      }
      case "ArrayProperty": {
        const count = r.u32();
        if (count > 200000) throw new Error("Implausible ArrayProperty count " + count);
        const items = new Array(count);
        for (let i = 0; i < count; i++) items[i] = readProps(r, boolWidth, depth + 1);
        value = items;
        break;
      }
      default: {
        const declaredEnd = sizeOffset + 8 + size;
        r.pos = declaredEnd;
        value = "[Unsupported " + kind + "]";
        break;
      }
    }
    props[name] = value;
  }
  throw new Error("Property count exceeds safety limit");
}

function canReadGameTypeAt(r, offset) {
  const save = r.pos;
  try {
    r.pos = offset;
    const s = r.fstr();
    r.pos = save;
    return s.startsWith("TAGame.Replay_");
  } catch (e) {
    r.pos = save;
    return false;
  }
}

function versionGte(maj, min, net, tMaj, tMin, tNet) {
  if (maj !== tMaj) return maj > tMaj;
  if (min !== tMin) return min > tMin;
  return (net || 0) >= tNet;
}

// Top-level parse: header -> body metadata -> network stream -> stats
// ---------------------------------------------------------------------
function parseReplay(bytes) {
  if (bytes.length < 32) throw new Error("File is too small to be a valid replay.");
  if (bytes.length > 64 * 1024 * 1024) throw new Error("Replay exceeds the 64 MB safety limit.");

  // --- Header ---
  const hr = makeByteReader(bytes);
  const headerSize = hr.u32();

  const headerEnd = 8 + headerSize;
  if (headerSize === 0 || headerEnd > bytes.length) throw new Error("Invalid replay header size.");
  hr.pos = 8;
  const majorVersion = hr.i32();
  const minorVersion = hr.i32();
  let netVersion = null;
  if (!canReadGameTypeAt(hr, hr.pos)) netVersion = hr.i32();
  const gameType = hr.fstr();
  if (!gameType.startsWith("TAGame.Replay_")) throw new Error("Unexpected replay game type: " + JSON.stringify(gameType));
  const headerProps = readProps(hr, 1);

  const rawPlayers = Array.isArray(headerProps.PlayerStats) ? headerProps.PlayerStats : [];
  const players = rawPlayers.filter((p) => p.bBot !== true).map((p) => ({
    name: typeof p.Name === "string" ? p.Name : "Unknown",
    team: typeof p.Team === "number" ? p.Team : -1,
    score: p.Score || 0, goals: p.Goals || 0, assists: p.Assists || 0, saves: p.Saves || 0, shots: p.Shots || 0,

  const NumFrames = headerProps.NumFrames || 0;
  const MaxChannels = headerProps.MaxChannels || 1023;
  const MatchType = headerProps.MatchType;

  // --- Body metadata ---
  const br = makeByteReader(bytes);
  br.pos = headerEnd;

  br.arr(() => br.fstr()); // levels
  br.arr(() => ({ time: br.f32(), frame: br.i32(), position: br.i32() })); // keyframes
  const networkStreamSize = br.u32();
  const networkStreamStart = br.pos;
  const networkStreamEnd = networkStreamStart + networkStreamSize;
  if (networkStreamEnd > bytes.length) throw new Error("Network stream extends past end of file.");
  br.pos = networkStreamEnd;
  br.arr(() => ({ frame: br.i32(), user: br.fstr(), text: br.fstr() })); // debug strings
  const tickMarks = br.arr(() => ({ type: br.fstr(), frame: br.i32() }));
  br.arr(() => br.fstr()); // packages
  const objects = br.arr(() => br.fstr());
  br.arr(() => br.fstr()); // names
  br.arr(() => ({ name: br.fstr(), index: br.i32() })); // class indices (unused directly)
  const netCache = br.arr(() => ({
    objectInd: br.i32(), parentId: br.i32(), id: br.i32(),
    properties: br.arr(() => ({ objectInd: br.i32(), streamId: br.i32() })),
  }));

  // --- Object index + hierarchy walk ---
  const nameToFirstIndex = new Map();
  objects.forEach((name, i) => { if (!nameToFirstIndex.has(name)) nameToFirstIndex.set(name, i); });
  const byName = (name) => (nameToFirstIndex.has(name) ? nameToFirstIndex.get(name) : null);

    let name = startName;
    for (;;) {
      const current = name;
      const parent = PARENT_CLASSES[normalizeObject(current)];
      if (parent === undefined) {
        const id = byName(current);
        if (id !== null) yield id;
        return;
      }
      name = parent;
      const id = byName(current);
      if (id !== null) yield id;
    }
  }

  const spawns = new Array(objects.length).fill(null);
  for (const [className, traj] of SPAWN_STATS) {
    const id = byName(className);
    if (id !== null) spawns[id] = traj;
  }
  for (const name of objects) {
    let result = SPAWN_NONE;
    const parentStack = [];

      parentStack.push(objId);

  }

  // --- Frame decode ---
  const channelWidth = Math.max(bitWidth(MaxChannels) - 1, 0);
  const channelBits = channelWidth;
  const isLan = MatchType === "Lan";
  const doParseName = versionGte(majorVersion, minorVersion, netVersion, 868, 20, 0) ||
    (versionGte(majorVersion, minorVersion, netVersion, 868, 14, 0) && !isLan);
  const netVer = netVersion || 0;

  const colorInd = byName("TAGame.ProductAttribute_UserColor_TA") ?? 0;
  const paintedInd = byName("TAGame.ProductAttribute_Painted_TA") ?? 0;
  const titleInd = byName("TAGame.ProductAttribute_TitleID_TA") ?? 0;
  const specialEditionInd = byName("TAGame.ProductAttribute_SpecialEdition_TA") ?? 0;
  const teamEditionInd = byName("TAGame.ProductAttribute_TeamEdition_TA") ?? 0;

  function decodeText(bits) {
    const size = bits.readI32();
    if (size === 0) return "";
    if (size < 0) {
      const buf16 = bits.readBytes(size * -2);
      if (!buf16) throw new Error("EOF decoding UTF-16 text");
      let s = new TextDecoder("utf-16le").decode(buf16);
      const t = s.indexOf("\0");
      return t === -1 ? s : s.slice(0, t);
    }
    const bufA = bits.readBytes(size);
    if (!bufA) throw new Error("EOF decoding text");
    let s = new TextDecoder("windows-1252").decode(bufA);
    const t = s.indexOf("\0");
    return t === -1 ? s : s.slice(0, t);
  }
  function decodeUniqueIdWithSystem(bits, system_id) {
    let remote_id;
    switch (system_id) {
      case 0: remote_id = { kind: "SplitScreen", value: bits.readBitsN(24) }; break;
      case 1: remote_id = { kind: "Steam", value: bits.readU64().toString() }; break;
      case 2: {
        const nameBuf = bits.readBytes(16);
        let end = nameBuf.indexOf(0); if (end === -1) end = nameBuf.length;
        const name = new TextDecoder("windows-1252").decode(nameBuf.subarray(0, end));
        bits.readBytes(netVer >= 1 ? 16 : 8);
        remote_id = { kind: "PlayStation", name, online_id: bits.readU64().toString() };
        break;
      }
      case 4: remote_id = { kind: "Xbox", value: bits.readU64().toString() }; break;
      case 5: remote_id = { kind: "QQ", value: bits.readU64().toString() }; break;
      case 6: { const online_id = bits.readU64().toString(); bits.readBytes(24); remote_id = { kind: "Switch", online_id }; break; }
      case 7: {
        const online_id = bits.readU64().toString();
        if (netVer < 10) bits.readBytes(24);
        remote_id = { kind: "PsyNet", online_id };
        break;
      }
      case 11: remote_id = { kind: "Epic", value: decodeText(bits) }; break;
      default: throw new Error("Unrecognized remote id system " + system_id);
    }
    const local_id = bits.readU8();
    return { system_id, remote_id, local_id };
  }
  function decodeUniqueId(bits) { const system_id = bits.readU8(); return decodeUniqueIdWithSystem(bits, system_id); }
  function decodeExplosion(bits) {
    const flag = bits.readBit(); const actor = bits.readI32(); const location = decodeVector3f(bits, netVer);
    return { flag, actor, location };
  }
  function decodeLoadout(bits) {
    const version = bits.readU8();
    const body = bits.readU32(), decal = bits.readU32(), wheels = bits.readU32(), rocket_trail = bits.readU32(),
      antenna = bits.readU32(), topper = bits.readU32(), unknown1 = bits.readU32();
    const unknown2 = version > 10 ? bits.readU32() : null;
    let engine_audio = null, trail = null, goal_explosion = null;
    if (version >= 16) { engine_audio = bits.readU32(); trail = bits.readU32(); goal_explosion = bits.readU32(); }
    const banner = version >= 17 ? bits.readU32() : null;
    const product_id = version >= 19 ? bits.readU32() : null;
    if (version >= 22) { bits.readU32(); bits.readU32(); bits.readU32(); }
    return { version, body, decal, wheels, rocket_trail, antenna, topper, unknown1, unknown2, engine_audio, trail, goal_explosion, banner, product_id };
  }
  function decodeProduct(bits) {
    const unknown = bits.readBit();
    const obj_ind = bits.readI32();
    let value;
    if (obj_ind === colorInd) {
      if (versionGte(majorVersion, minorVersion, netVersion, 868, 23, 8)) value = { kind: "NewColor", v: bits.readU32() };
      else { const v = bits.ifGet((b) => b.readBitsN(31)); value = v == null ? { kind: "NoColor" } : { kind: "OldColor", v }; }
    } else if (obj_ind === paintedInd) {
      if (versionGte(majorVersion, minorVersion, netVersion, 868, 18, 0)) value = { kind: "NewPaint", v: bits.readBitsN(31) };
      else value = { kind: "OldPaint", v: bits.readBitsMaxComputed(3, 14) };
    } else if (obj_ind === titleInd) {
      value = { kind: "Title", v: decodeText(bits) };
    } else if (obj_ind === specialEditionInd) {
      value = { kind: "SpecialEdition", v: bits.readBitsN(31) };
    } else if (obj_ind === teamEditionInd) {
      if (versionGte(majorVersion, minorVersion, netVersion, 868, 18, 0)) value = { kind: "NewTeamEdition", v: bits.readBitsN(31) };
      else value = { kind: "OldTeamEdition", v: bits.readBitsMaxComputed(3, 14) };
    } else {
      value = { kind: "Absent" };
    }
    return { unknown, obj_ind, value };
  }
  function decodeOnlineLoadout(bits) {
    const size = bits.readU8();
    const res = [];
    for (let i = 0; i < size; i++) {
      const attrSize = bits.readU8();
      const products = [];
      for (let j = 0; j < attrSize; j++) products.push(decodeProduct(bits));
      res.push(products);
    }
    return res;
  }
  function decodeActiveActor(bits) { return { active: bits.readBitsN(1) === 1, actor: bits.readI32() }; }

  function decodeAttribute(tag, bits) {
    switch (tag) {
      case "Boolean": return bits.readBit();
      case "Byte": return bits.readU8();
      case "ActiveActor": return decodeActiveActor(bits);
      case "RigidBody": {
        const sleeping = bits.readBit();
        const location = decodeVector3f(bits, netVer);
        const rotation = netVer >= 7 ? decodeQuaternion(bits) : decodeQuaternionCompressed(bits);
        let linear = null, angular = null;
        if (!sleeping) { linear = decodeVector3f(bits, netVer); angular = decodeVector3f(bits, netVer); }
        return { sleeping, location, rotation, linear, angular };
      }
      case "Float": return bits.readF32();
      case "Int": return bits.readI32();
      case "Int64": return bits.readI64();
      case "Enum": return bits.readBitsN(11);
      case "RotationTag": return decodeRotation(bits);
      case "String": return decodeText(bits);
      case "QWordString": return isRl223 ? decodeText(bits) : bits.readU64().toString();
      case "Demolish": {
        const attacker_flag = bits.readBit(), attacker = bits.readI32(), victim_flag = bits.readBit(), victim = bits.readI32();
        return { attacker_flag, attacker, victim_flag, victim, attack_velocity: decodeVector3f(bits, netVer), victim_velocity: decodeVector3f(bits, netVer) };
      }
      case "DemolishFx": {
        const custom_demo_flag = bits.readBit(), custom_demo_id = bits.readI32();
        const attacker_flag = bits.readBit(), attacker = bits.readI32(), victim_flag = bits.readBit(), victim = bits.readI32();
        return { custom_demo_flag, custom_demo_id, attacker_flag, attacker, victim_flag, victim, attack_velocity: decodeVector3f(bits, netVer), victim_velocity: decodeVector3f(bits, netVer) };
      }
      case "DemolishExtended": {
        const attacker_pri = decodeActiveActor(bits), self_demo = decodeActiveActor(bits), self_demolish = bits.readBit();
        const goal_explosion_owner = decodeActiveActor(bits), attacker = decodeActiveActor(bits), victim = decodeActiveActor(bits);
        return { attacker_pri, self_demo, self_demolish, goal_explosion_owner, attacker, victim, attacker_velocity: decodeVector3f(bits, netVer), victim_velocity: decodeVector3f(bits, netVer) };
      }
      case "Location": return decodeVector3f(bits, netVer);
      case "UniqueId": return decodeUniqueId(bits);
      case "Reservation": {
        const number = bits.readBitsN(3);
        const unique = decodeUniqueId(bits);
        let name = null;
        if (unique.system_id !== 0) name = decodeText(bits);
        else if (!(unique.remote_id.kind === "SplitScreen" && unique.remote_id.value === 0)) {
          let s = "";
          for (let i = 0; i < 255; i++) { const c = bits.readU8(); if (c === 0) break; s += String.fromCharCode(c); }
          name = s;
        }
        const unknown1 = bits.readBit(), unknown2 = bits.readBit();
        const unknown3 = versionGte(majorVersion, minorVersion, netVersion, 868, 12, 0) ? bits.readBitsN(6) : null;
        return { number, unique, name, unknown1, unknown2, unknown3 };
      }
      case "PartyLeader": { const system_id = bits.readU8(); return system_id !== 0 ? decodeUniqueIdWithSystem(bits, system_id) : null; }
      case "PrivateMatchSettings": {
        const mutators = decodeText(bits), joinable_by = bits.readU32(), max_players = bits.readU32();
        const game_name = decodeText(bits), password = decodeText(bits), flag = bits.readBit();
        return { mutators, joinable_by, max_players, game_name, password, flag };
      }
      case "AppliedDamage": {
        const id = bits.readU8(), position = decodeVector3f(bits, netVer), damage_index = bits.readI32(), total_damage = bits.readI32();
        return { id, position, damage_index, total_damage };
      }
      case "DamageState": {
        const tile_state = bits.readU8(), damaged = bits.readBit(), offender = bits.readI32();
        const ball_position = decodeVector3f(bits, netVer), direct_hit = bits.readBit(), unknown1 = bits.readBit();
        return { tile_state, damaged, offender, ball_position, direct_hit, unknown1 };
      }
      case "CamSettings": {
        const fov = bits.readF32(), height = bits.readF32(), angle = bits.readF32(), distance = bits.readF32(),
          stiffness = bits.readF32(), swivel = bits.readF32();
        const transition = versionGte(majorVersion, minorVersion, netVersion, 868, 20, 0) ? bits.readF32() : null;
        return { fov, height, angle, distance, stiffness, swivel, transition };
      }
      case "ClubColors": {
        const blue_flag = bits.readBit(), blue_color = bits.readU8(), orange_flag = bits.readBit(), orange_color = bits.readU8();
        return { blue_flag, blue_color, orange_flag, orange_color };
      }
      case "Explosion": return decodeExplosion(bits);
      case "ExtendedExplosion": { const explosion = decodeExplosion(bits); const unknown1 = bits.readBit(); const secondary_actor = bits.readI32(); return { explosion, unknown1, secondary_actor }; }
      case "FlaggedByte": return { b: bits.readBit(), data: bits.readU8() };
      case "GameMode": { const init = versionGte(majorVersion, minorVersion, netVersion, 868, 12, 0) ? 8 : 2; return { init, value: bits.readBitsN(init) }; }
      case "Loadout": return decodeLoadout(bits);
      case "TeamLoadout": return { blue: decodeLoadout(bits), orange: decodeLoadout(bits) };
      case "MusicStinger": return { flag: bits.readBit(), cue: bits.readU32(), trigger: bits.readU8() };
      case "PlayerHistoryKey": return bits.readBitsN(14);
      case "Pickup": return { instigator: bits.ifGet((b) => b.readI32()), picked_up: bits.readBit() };
      case "PickupNew": return { instigator: bits.ifGet((b) => b.readI32()), picked_up: bits.readU8() };
      case "Welded": {
        const active = bits.readBit(), actor = bits.readI32(), offset = decodeVector3f(bits, netVer), mass = bits.readF32(), rotation = decodeRotation(bits);
        return { active, actor, offset, mass, rotation };
      }
      case "Title": return [bits.readBit(), bits.readBit(), bits.readU32(), bits.readU32(), bits.readU32(), bits.readU32(), bits.readU32(), bits.readBit()];
      case "TeamPaint": {
        const team = bits.readU8(), primary_color = bits.readU8(), accent_color = bits.readU8(), primary_finish = bits.readU32(), accent_finish = bits.readU32();
        return { team, primary_color, accent_color, primary_finish, accent_finish };
      }
      case "StatEvent": return { unknown1: bits.readBit(), object_id: bits.readI32() };
      case "RepStatTitle": {
        const unknown = bits.readBit(), name = decodeText(bits), unknown2 = bits.readBit(), index = bits.readU32(), value = bits.readU32();
        return { unknown, name, unknown2, index, value };
      }
      case "PickupInfo": return { available_pickups: [decodeActiveActor(bits), decodeActiveActor(bits), decodeActiveActor(bits)], items_are_preview: bits.readBit() };
      case "Impulse": return { compressed_rotation: bits.readI32(), speed: bits.readF32() };
      case "ReplicatedBoost": return { grant_count: bits.readU8(), boost_amount: bits.readU8(), unused1: bits.readU8(), unused2: bits.readU8() };
      case "LogoData": return { logo_id: bits.readU32(), swap_colors: bits.readBit() };
      case "LoadoutOnline": return decodeOnlineLoadout(bits);
      case "LoadoutsOnline": return { blue: decodeOnlineLoadout(bits), orange: decodeOnlineLoadout(bits), unknown1: bits.readBit(), unknown2: bits.readBit() };
      case "NotImplemented": throw new Error("Unrecognized replicated property — likely an unsupported replay/engine version.");
      default: throw new Error("Unhandled attribute tag: " + tag);
    }
  }

  function parseNewActor(bits, actorId) {
    let nameId = null;
    if (doParseName) nameId = bits.readI32();
    bits.readBit();
    const objectId = bits.readI32();
    if (objectId === null || objectId < 0 || objectId >= objects.length) throw new Error("New actor references out-of-range object id " + objectId);
    const spawn = spawns[objectId];
    let location = null, rotation = null;
    if (spawn === SPAWN_LOCATION) location = decodeVector3i(bits, netVer);
    else if (spawn === SPAWN_LOC_ROT) { location = decodeVector3i(bits, netVer); rotation = decodeRotation(bits); }
    return { actorId, nameId, objectId, location, rotation };
  }

  const netBits = new BitReader(bytes, networkStreamStart, networkStreamEnd);
  const actors = new Map();
  const updatedAttrEvents = [];
  let frameCount = 0;
  let frameTime = 0;
  const targetFrames = NumFrames;

  while (!netBits.isEmpty() && frameCount < targetFrames) {
    const time = netBits.readF32();
    if (time === null) break;
    const delta = netBits.readF32();
    if (delta === null) break;
    if (time === 0 && delta === 0) break;
    frameTime = time;

    for (;;) {
      const cont = netBits.readBit();
      if (cont === null) throw new Error("Unexpected end of network stream (actor list).");
      if (!cont) break;
      const actorId = netBits.readBitsMaxComputed(channelBits, MaxChannels);
      if (actorId === null) throw new Error("Unexpected end of network stream (actor id).");
      const alive = netBits.readBit();
      if (alive) {
        const isNew = netBits.readBit();
        if (isNew) {
          const actor = parseNewActor(netBits, actorId);
          const cacheInfo = cacheInfoByObjId[actor.objectId];
          if (!cacheInfo) throw new Error("Missing net-cache info for spawned object " + objects[actor.objectId]);
          actors.set(actorId, { objectId: actor.objectId, cacheInfo });
        } else {
          const entry = actors.get(actorId);
          if (!entry) throw new Error("Update referenced an unknown actor id " + actorId);
          for (;;) {
            const more = netBits.readBit();
            if (more === null) throw new Error("Unexpected end of network stream (property list).");
            if (!more) break;
            const streamId = netBits.readBitsMaxComputed(entry.cacheInfo.propIdBits, entry.cacheInfo.maxPropId);
            if (streamId === null) throw new Error("Unexpected end of network stream (stream id).");
            const attr = entry.cacheInfo.attributes.get(streamId);
            if (!attr) throw new Error("Unknown replicated property id on " + objects[entry.objectId]);
            const value = decodeAttribute(attr.attribute, netBits);
            updatedAttrEvents.push({ actorId, objectId: entry.objectId, propName: attr.propName, tag: attr.attribute, value, time });
          }
        }
      } else {
        actors.delete(actorId);
      }
    }
    frameCount++;
  }

  // --- Post-process: PRI names, car->PRI links, box score, demolitions ---
  const priNameByActor = new Map();
  const carToPri = new Map();
  const finalPriStat = new Map();
  const setStat = (actorId, key, value) => {
    if (!finalPriStat.has(actorId)) finalPriStat.set(actorId, {});
    finalPriStat.get(actorId)[key] = value;
  };
  const demolishRaw = [];

  for (const u of updatedAttrEvents) {
    switch (u.propName) {
      case "Engine.PlayerReplicationInfo:PlayerName": priNameByActor.set(u.actorId, u.value); break;
      case "Engine.Pawn:PlayerReplicationInfo": if (u.value.active) carToPri.set(u.actorId, u.value.actor); break;
      case "TAGame.PRI_TA:MatchGoals": setStat(u.actorId, "goals", u.value); break;
      case "TAGame.PRI_TA:MatchAssists": setStat(u.actorId, "assists", u.value); break;
      case "TAGame.PRI_TA:MatchSaves": setStat(u.actorId, "saves", u.value); break;
      case "TAGame.PRI_TA:MatchShots": setStat(u.actorId, "shots", u.value); break;
      case "TAGame.PRI_TA:MatchScore": setStat(u.actorId, "score", u.value); break;
    }
    if (u.tag === "Demolish" || u.tag === "DemolishFx") {
      demolishRaw.push({ time: u.time, carActor: u.actorId, attackerCar: u.value.attacker, victimCar: u.value.victim, attackerPriDirect: null, selfDemolish: null });
    } else if (u.tag === "DemolishExtended") {
      demolishRaw.push({
        time: u.time, carActor: u.actorId,
        attackerCar: u.value.attacker.active ? u.value.attacker.actor : null,
        victimCar: u.value.victim.active ? u.value.victim.actor : null,
        attackerPriDirect: u.value.attacker_pri.active ? u.value.attacker_pri.actor : null,
        selfDemolish: u.value.self_demolish,
      });
    }
  }

  const demolitions = demolishRaw.map((d) => {
    const attackerPri = d.attackerPriDirect ?? carToPri.get(d.attackerCar) ?? null;
    const victimPri = carToPri.get(d.victimCar) ?? null;
    return {
      time: d.time,
      attacker: attackerPri != null ? (priNameByActor.get(attackerPri) ?? null) : null,
      victim: victimPri != null ? (priNameByActor.get(victimPri) ?? null) : null,
      selfDemolish: !!d.selfDemolish,
    };
  }).filter((d) => d.attacker && d.victim);

  // Merge network-derived stats onto header players by matching PlayerName;
  // fall back to header's own end-of-game numbers if a name never got a
  // network update (e.g. a stat that stayed at zero the whole match).
  const netStatsByName = new Map();
  for (const [actorId, stat] of finalPriStat) {
    const name = priNameByActor.get(actorId);
    if (name) netStatsByName.set(name, stat);
  }
  const demoCountByName = new Map();
  const demoedCountByName = new Map();
  for (const d of demolitions) {
    demoCountByName.set(d.attacker, (demoCountByName.get(d.attacker) || 0) + 1);
    demoedCountByName.set(d.victim, (demoedCountByName.get(d.victim) || 0) + 1);
  }

  const finalPlayers = players.map((p) => ({
    ...p,
    demos: demoCountByName.get(p.name) || 0,
    demoed: demoedCountByName.get(p.name) || 0,
  }));

  return {
    meta: { majorVersion, minorVersion, netVersion, buildVersion: BuildVersion, matchType: MatchType, replayId: headerProps.Id || null },
    match: {
      team0Score: headerProps.Team0Score || 0, team1Score: headerProps.Team1Score || 0,
      mapName: headerProps.MapName || null, date: headerProps.Date || null,
      numFrames: NumFrames, decodedFrames: frameCount, durationSeconds: frameTime,
    },
    players: finalPlayers,
    demolitions: demolitions.sort((a, b) => a.time - b.time),
    frameCoverage: targetFrames > 0 ? frameCount / targetFrames : 0,
    headerProps,
  };
}

// =======================================================================
// UI
// =======================================================================
const dropEl = document.getElementById("drop");
const dropText = document.getElementById("dropText");
const fileInput = document.getElementById("fileInput");
const analyzeBtn = document.getElementById("analyzeBtn");
const errorBox = document.getElementById("errorBox");
const warnBox = document.getElementById("warnBox");
const resultsEl = document.getElementById("results");

let pendingFile = null;
let lastResult = null;
let lastFileName = "";

dropEl.addEventListener("click", () => fileInput.click());
dropEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
});
dropEl.addEventListener("dragover", (e) => { e.preventDefault(); dropEl.classList.add("drag"); });
dropEl.addEventListener("dragleave", () => dropEl.classList.remove("drag"));
dropEl.addEventListener("drop", (e) => {
  e.preventDefault();
  dropEl.classList.remove("drag");
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) loadFile(f);
});
function loadFile(f) {
  pendingFile = f;
  dropText.innerHTML = '<span class="fname">' + escapeHtml(f.name) + "</span>";
  analyzeBtn.disabled = false;
  errorBox.innerHTML = "";
  warnBox.innerHTML = "";
  resultsEl.innerHTML = "";
}

analyzeBtn.addEventListener("click", async () => {
  if (!pendingFile) return;
  errorBox.innerHTML = "";
  warnBox.innerHTML = "";
  resultsEl.innerHTML = "";
  analyzeBtn.disabled = true;
  analyzeBtn.innerHTML = '<span class="spin"></span>Analyzing…';
  await new Promise((r) => setTimeout(r, 10)); // let the spinner paint
  try {
    if (pendingFile.size > 64 * 1024 * 1024) throw new Error("File too large (max 64 MB).");
    const buf = new Uint8Array(await pendingFile.arrayBuffer());
    const result = parseReplay(buf);
    lastResult = result;
    lastFileName = pendingFile.name.replace(/\.replay$/i, "");
    render(result);
  } catch (err) {
    errorBox.innerHTML = '<div class="error"><strong>Parse failed</strong>\n' + escapeHtml(err && err.message ? err.message : String(err)) + "</div>";
  } finally {
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = "Analyze Replay";
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtClock(seconds) {
  const s = Math.max(0, Math.round(seconds));
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

function render(result) {
  if (result.frameCoverage < 0.999) {
    warnBox.innerHTML = '<div class="warn">Only decoded ' + (result.frameCoverage * 100).toFixed(1) +
      "% of the network stream (" + result.match.decodedFrames + " / " + result.match.numFrames +
      " frames) before running out of data — stats and demolitions below may be incomplete.</div>";
  }

  const team0 = result.players.filter((p) => p.team === 0);
  const team1 = result.players.filter((p) => p.team === 1);

  const summaryHtml =
    '<div class="card"><div class="summary">' +
      '<div class="score"><span class="b">' + result.match.team0Score + '</span><span class="dash">–</span><span class="o">' + result.match.team1Score + "</span></div>" +
      (result.match.mapName ? '<div class="meta-item"><span class="k">Map</span>' + escapeHtml(result.match.mapName) + "</div>" : "") +
      (result.match.date ? '<div class="meta-item"><span class="k">Date</span>' + escapeHtml(result.match.date) + "</div>" : "") +
      '<div class="meta-item"><span class="k">Duration</span>' + fmtClock(result.match.durationSeconds) + "</div>" +
      '<div class="meta-item"><span class="k">Frames</span>' + result.match.decodedFrames.toLocaleString() + "</div>" +
    "</div></div>";

  const teamTable = (label, cls, list) => {
    if (list.length === 0) return "";
    let rows = list.map((p) =>
      "<tr><td class=\"pname\">" + escapeHtml(p.name) + "</td>" +
      '<td class="num">' + p.score + "</td><td class=\"num\">" + p.goals + "</td><td class=\"num\">" + p.assists + "</td>" +
      '<td class="num">' + p.saves + "</td><td class=\"num\">" + p.shots + "</td>" +
      '<td class="num">' + p.demos + "</td><td class=\"num\">" + p.demoed + "</td></tr>"
    ).join("");
    return '<div class="card"><div class="team-head ' + cls + '">' + label + "</div>" +
      '<div class="table-scroll"><table><thead><tr><th>Player</th><th class="num">Score</th><th class="num">Goals</th><th class="num">Assists</th>' +
      '<th class="num">Saves</th><th class="num">Shots</th><th class="num">Demos</th><th class="num">Demoed</th></tr></thead>' +
      "<tbody>" + rows + "</tbody></table></div></div>";
  };

  let demoHtml;
  if (result.demolitions.length === 0) {
    demoHtml = '<div class="card"><div class="card-header">Demolitions (0)</div><div class="demo-empty">No demolitions detected in this replay.</div></div>';
  } else {
    const rows = result.demolitions.map((d) =>
      '<div class="demo-row"><span class="demo-t">' + fmtClock(d.time) + "</span><span>" +
      '<span class="pname">' + escapeHtml(d.attacker) + "</span> demolished <span class=\"pname\">" + escapeHtml(d.victim) + "</span>" +
      (d.selfDemolish ? ' <span class="badge self">self</span>' : "") +
      "</span></div>"
    ).join("");
    demoHtml = '<div class="card"><div class="card-header">Demolitions (' + result.demolitions.length + ")</div><div class=\"demo-list\">" + rows + "</div></div>";
  }

  const actionsHtml =
    '<div class="card"><div class="row"><div class="actions">' +
      '<button id="dlCsv" class="btn-outline">Download CSV</button>' +
      '<button id="dlJson" class="btn-outline">Download Raw JSON</button>' +
      '<span id="saveStatus" class="save-note"></span>' +
    "</div></div></div>";

  const rawHtml =
    "<details><summary>Raw header properties</summary><pre>" + escapeHtml(JSON.stringify(result.headerProps, jsonReplacer, 1)) + "</pre></details>";

  resultsEl.innerHTML = summaryHtml + teamTable("Blue Team (team 0)", "blue", team0) + teamTable("Orange Team (team 1)", "orange", team1) +
    demoHtml + actionsHtml + '<div class="card">' + rawHtml + "</div>";

  document.getElementById("dlCsv").addEventListener("click", () => downloadCsv().catch(reportSaveError));
  document.getElementById("dlJson").addEventListener("click", () => downloadJson().catch(reportSaveError));
}

function jsonReplacer(key, value) { return typeof value === "bigint" ? value.toString() : value; }

// Opened as a plain file (double-clicked, or served from any ordinary web
// host) this page has no `window.claude` at all, so `<a download>` is the
// right tool. Opened inside the claude.ai artifact viewer, that link is
// inert by design — the `downloads` capability is the only way to hand the
// viewer a file there. Try the capability first and fall back to the plain
// link whenever it's absent or the platform declines it for a reason other
// than the viewer saying no.
let downloadsCapability;
async function getDownloadsCapability() {
  if (downloadsCapability !== undefined) return downloadsCapability;
  if (!window.claude || typeof window.claude.use !== "function") return (downloadsCapability = null);
  try {
    downloadsCapability = await window.claude.use("downloads");
  } catch (e) {
    downloadsCapability = null;
  }
  return downloadsCapability;
}

function triggerBlobDownload(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function setSaveStatus(text) {
  const el = document.getElementById("saveStatus");
  if (el) el.textContent = text;
}

async function saveFile(filename, content, mime) {
  const downloads = await getDownloadsCapability();
  if (!downloads) { triggerBlobDownload(filename, content, mime); return; }
  try {
    await downloads.save({ filename, data: content });
    setSaveStatus("Saved " + filename);
  } catch (err) {
    const code = err && err.code;
    if (code === "declined") { setSaveStatus("Save cancelled."); return; }
    if (code === "rejected_extension" || code === "extension_not_enabled") {
      const fallbackName = filename.replace(/\.[^.]+$/, ".txt");
      try {
        await downloads.save({ filename: fallbackName, data: content });
        setSaveStatus("Saved as " + fallbackName + " (." + filename.split(".").pop() + " isn't enabled here)");
        return;
      } catch (err2) {
        if (err2 && err2.code === "declined") { setSaveStatus("Save cancelled."); return; }
      }
    }
    throw err;
  }
}

function reportSaveError(err) {
  setSaveStatus((err && err.message) ? err.message : "Couldn't save the file.");
}

function csvEscape(v) {
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

async function downloadCsv() {
  if (!lastResult) return;
  const header = ["player", "team", "score", "goals", "assists", "saves", "shots", "demos", "demoed"];
  const lines = [header.join(",")];
  for (const p of lastResult.players) {
    lines.push([p.name, p.team, p.score, p.goals, p.assists, p.saves, p.shots, p.demos, p.demoed].map(csvEscape).join(","));
  }
  lines.push("");
  lines.push(["time", "attacker", "victim", "self_demolish"].join(","));
  for (const d of lastResult.demolitions) {
    lines.push([fmtClock(d.time), d.attacker, d.victim, d.selfDemolish].map(csvEscape).join(","));
  }
  await saveFile((lastFileName || "replay") + "-stats.csv", lines.join("\r\n"), "text/csv");
}

async function downloadJson() {
  if (!lastResult) return;
  await saveFile((lastFileName || "replay") + "-parsed.json", JSON.stringify(lastResult, jsonReplacer, 2), "application/json");
}
</script>
</body>
</html>
